name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # nightly full suite (slow tests included)
  workflow_dispatch:  # manual full-suite run from the Actions tab

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Fast suite (offscreen)
        run: python -m pytest tests -q -p no:cacheprovider --no-cov -m "not slow" -n auto
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Lint
        run: python -m flake8 app tests tools main.py build_portable.py build_installer.py --max-line-length=120 --count

  full:
    # Heavy suite (video/batch/perf/sleeps): nightly + on demand, not per push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Full suite (offscreen)
        run: python -m pytest tests -q -n auto
        env:
          QT_QPA_PLATFORM: offscreen
