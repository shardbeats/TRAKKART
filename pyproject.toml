[project]
name = "trakkart"
version = "1.4.0"
description = "TRAKKART — offline cover art studio (ShardBeats TRAKK SUITE)"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6,<7.0",
  "Pillow>=10.0",
  "numpy>=1.24",
  "numba>=0.60",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-bdd>=7.0",
  "pytest-cov>=5.0",
  "coverage>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
